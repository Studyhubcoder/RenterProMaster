<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Rent Manager</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--border:#dfe5ee;--primary:#2563eb;--primary2:#1d4ed8;--ok:#16834b;--danger:#d52f3f;--warn:#b45309;--shadow:0 8px 24px #17203312}
:root.dark{--bg:#11151c;--card:#1a202a;--text:#eef2f7;--muted:#9aa6b6;--border:#303948;--primary:#4f8cff;--primary2:#3675e8;--shadow:0 8px 24px #0005}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav{max-width:1050px;margin:auto;padding:12px 16px;display:flex;gap:10px;align-items:center}.brand{font-weight:800;font-size:18px;margin-right:auto}
main{max-width:1050px;margin:auto;padding:18px 16px 90px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.stat b{font-size:25px;display:block}.muted{color:var(--muted);font-size:13px}.title{font-size:22px;font-weight:800;margin:5px 0 14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap}
button,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px}.primary{background:var(--primary);border-color:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.danger{color:var(--danger)}.small{padding:6px 9px;font-size:13px}
input,select{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}.badge{display:inline-flex;padding:3px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}.paid{color:var(--ok)}.due{color:var(--danger)}.warn{color:var(--warn)}
.alert{padding:11px 13px;border-radius:12px;background:#fff2e0;color:#8a4b00;border:1px solid #f2ca92;margin-bottom:12px}.empty{text-align:center;padding:28px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.login{max-width:440px;margin:10vh auto;padding:16px}.logo{font-size:38px;text-align:center}.center{text-align:center}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--border);vertical-align:top}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:10px;z-index:50;display:none}
dialog{border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);max-width:520px;width:calc(100% - 24px);box-shadow:var(--shadow)}dialog::backdrop{background:#0008}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.grid2,.form{grid-template-columns:1fr}.table{font-size:13px}.hide-mobile{display:none}.nav{padding:10px 12px}main{padding:14px 12px 80px}.card{padding:13px}.title{font-size:20px}}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.grid .stat b{font-size:20px}.nav .brand{font-size:16px}}
@media print{header,.actions,.tabs,.no-print{display:none!important}main{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}.app{background:#fff;color:#111}}

.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.role-card{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:18px;border:1px solid var(--border);background:var(--card);border-radius:16px}.role-card span{font-size:34px}.role-card b{font-size:16px}.role-card small{color:var(--muted);line-height:1.35}.role-chip{font-size:11px;border:1px solid var(--border);padding:2px 7px;border-radius:99px;color:var(--muted);vertical-align:middle}.status-line,.status-list{display:flex;gap:12px;flex-wrap:wrap;padding-top:10px;color:var(--muted);font-size:13px}.status-list{display:block}.status-list>div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}.status-list>div:last-child{border-bottom:0}.status-card{text-align:center}.status-icon{font-size:30px}.big{display:block;font-size:25px;margin:5px 0 10px}.renter-welcome{display:flex;align-items:center}.renter-alert{font-weight:700}@media(max-width:600px){.role-grid{grid-template-columns:1fr}.role-card{min-height:125px}}
.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.details-grid>div{background:var(--surface2);padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:4px}.details-grid .full{grid-column:1/-1}.danger-text{color:#dc2626}@media(max-width:640px){.details-grid{grid-template-columns:1fr}.details-grid .full{grid-column:auto}}

/* v9 advanced UI */
button,.role-card,.card,.status-card,.stat,.badge{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}button:hover{transform:translateY(-1px);box-shadow:0 6px 18px #17203318}.primary{box-shadow:0 5px 14px #2563eb33}.brand{letter-spacing:-.2px}.logo{animation:logoFloat 2.8s ease-in-out infinite}.status-icon{display:inline-block;animation:iconFloat 2.4s ease-in-out infinite}.role-card span{animation:iconFloat 2.6s ease-in-out infinite}.role-card:hover,.card:hover{transform:translateY(-2px)}@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.renter-photo{width:88px;height:88px;border-radius:22px;object-fit:cover;border:3px solid var(--primary);box-shadow:0 8px 24px #17203322}.photo-placeholder{width:88px;height:88px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:34px;box-shadow:0 8px 24px #17203322}.detail-hero{display:flex;gap:16px;align-items:center;margin-bottom:16px}.unit-box{background:linear-gradient(135deg,#2563eb12,#4f8cff08);border:1px solid var(--border);border-radius:14px;padding:12px}.payment-meta{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"></div><div class="toast" id="toast"></div>
<dialog id="billDialog"></dialog>
<script>
"use strict";

const KEY="rent_manager_v3";
const SESSION_KEY="rent_manager_session_v2";
const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const monthNow=()=>today().slice(0,7);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysLate=d=>Math.floor((new Date(today())-new Date(d+"T00:00:00"))/86400000);
const seed={version:9,settings:{theme:"system",name:"My Property"},users:[],tenants:[],bills:[],payments:[],deletedTenants:[]};
let db=load(), session=loadSession(), page="dashboard", filterMonth="all", authScreen="home";

function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!x)x=structuredClone(seed);x.version=9;x.settings ||= {theme:"system",name:"My Property"};x.users ||= [];x.tenants ||= [];x.bills ||= [];x.payments ||= [];x.deletedTenants ||= [];
  // Migrate old landlord-only users into the new role model.
  x.users.forEach(u=>{if(!u.role)u.role="landlord"});
  x.tenants.forEach(t=>{if(t.renterEmail===undefined)t.renterEmail="";if(t.renterPasswordHash===undefined)t.renterPasswordHash="";if(t.renterSalt===undefined)t.renterSalt="";t.fatherName??="";t.aadhaar??="";t.registrationNo??="";t.originalAddress??="";t.oldAddress??="";t.age??="";t.moveInDate??="";t.photo??="";t.unitRate??=0});
  localStorage.setItem(KEY,JSON.stringify(x));return x}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function loadSession(){try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null")}catch{return null}}
function saveSession(s){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(s))}catch{}}
function clearSession(){try{sessionStorage.removeItem(SESSION_KEY)}catch{}}
function toast(x){const t=$("#toast");if(!t)return;t.textContent=x;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2300)}
function applyTheme(){let t=db.settings.theme;if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.classList.toggle("dark",t==="dark")}
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",applyTheme);applyTheme();

async function hashPassword(password,salt){const enc=new TextEncoder();const key=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:210000,hash:"SHA-256"},key,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function randSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function registerLandlord(name,email,password){if(!name)throw Error("Enter your name.");if(password.length<8)throw Error("Use at least 8 characters.");if(db.users.some(u=>u.email.toLowerCase()===email.toLowerCase()))throw Error("Email already exists.");const salt=randSalt();const u={id:uid(),name,email,passwordHash:await hashPassword(password,salt),salt,role:"landlord",createdAt:new Date().toISOString()};db.users.push(u);save();session={role:"landlord",userId:u.id};saveSession(session)}
async function loginLandlord(email,password){const u=db.users.find(x=>x.role==="landlord"&&x.email.toLowerCase()===email.toLowerCase());if(!u)throw Error("Landlord account not found.");const h=await hashPassword(password,u.salt);if(h!==u.passwordHash)throw Error("Incorrect password.");session={role:"landlord",userId:u.id};saveSession(session)}
async function loginRenter(email,password){const t=db.tenants.find(x=>x.renterEmail&&x.renterEmail.toLowerCase()===email.toLowerCase());if(!t||!t.renterPasswordHash)throw Error("Renter account not found. Ask the landlord to create your login.");const h=await hashPassword(password,t.renterSalt);if(h!==t.renterPasswordHash)throw Error("Incorrect password.");session={role:"renter",tenantId:t.id};saveSession(session)}
function currentLandlord(){return session?.role==="landlord"?db.users.find(u=>u.id===session.userId):null}
function currentRenter(){return session?.role==="renter"?db.tenants.find(t=>t.id===session.tenantId):null}
function signout(){session=null;clearSession();page="dashboard";authScreen="home";render()}
function requireAuth(){if(!session){renderLoginHome();return false}if(session.role==="landlord"&&!currentLandlord()){signout();return false}if(session.role==="renter"&&!currentRenter()){signout();return false}return true}

function renderLoginHome(){authScreen="home";$("#app").innerHTML=`<div class="login"><div class="card login-card"><div class="logo">🏠</div><h1 class="center">Rent Manager</h1><p class="muted center">Choose how you want to sign in</p><div class="role-grid"><button class="role-card" onclick="showLandlordLogin()"><span>👨‍💼</span><b>Landlord / Admin</b><small>Manage all rental pages, tenants, bills and payments</small></button><button class="role-card" onclick="showRenterLogin()"><span>🏠</span><b>Renter</b><small>View only your current-month rent and electricity status</small></button></div></div><p class="muted center">A renter account is created by the landlord.</p></div>`}
function showLandlordLogin(){authScreen="landlord";renderAuth()}
function showRenterLogin(){authScreen="renter";renderAuth()}
function renderAuth(){
const landlord=authScreen==="landlord";
$("#app").innerHTML=`<div class="login"><div class="card login-card"><button class="small" onclick="renderLoginHome()">← Back</button><div class="logo">${landlord?"👨‍💼":"🏠"}</div><h1 class="center">${landlord?"Landlord / Admin":"Renter"} Login</h1><p class="muted center">${landlord?"One admin panel controls all rental pages.":"See your own monthly payment status."}</p><div class="form"><div class="full"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="full"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div><button class="primary full" id="submit">Log in</button></div>${landlord?`<div class="center" style="margin-top:14px"><button class="small" onclick="showLandlordRegister()">Create landlord account</button></div>`:`<p class="muted center" style="margin-top:14px">Don't have login details? Ask your landlord.</p>`}</div></div>`;
$("#submit").onclick=async()=>{try{if(landlord)await loginLandlord($("#email").value.trim(),$("#pw").value);else await loginRenter($("#email").value.trim(),$("#pw").value);page=landlord?"dashboard":"renter";render()}catch(e){toast(e.message)}}}
function showLandlordRegister(){authScreen="register";$("#app").innerHTML=`<div class="login"><div class="card login-card"><button class="small" onclick="showLandlordLogin()">← Back</button><div class="logo">👨‍💼</div><h1 class="center">Create Landlord Account</h1><div class="form"><div class="full"><label>Name</label><input id="name" autocomplete="name"></div><div class="full"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div><label>Password</label><input id="pw" type="password" autocomplete="new-password"></div><div><label>Confirm</label><input id="pw2" type="password" autocomplete="new-password"></div><button class="primary full" id="submit">Create account</button></div></div></div>`;$("#submit").onclick=async()=>{try{if($("#pw").value!==$("#pw2").value)throw Error("Passwords do not match.");await registerLandlord($("#name").value.trim(),$("#email").value.trim(),$("#pw").value);page="dashboard";render()}catch(e){toast(e.message)}}}

function nav(){return `<header><div class="nav"><div class="brand">🏠 Rent Manager <span class="role-chip">Admin</span></div><button class="small" id="theme">🌓</button><button class="small" id="export">Backup</button><button class="small" id="logout">Log out</button></div></header>`}
function renterNav(){return `<header><div class="nav"><div class="brand">🏠 My Rental <span class="role-chip">Renter</span></div><button class="small" id="theme">🌓</button><button class="small" id="logout">Log out</button></div></header>`}
function render(){applyTheme();if(!requireAuth())return;if(session.role==="renter")return renderRenter();renderAdmin()}
function renderAdmin(){const u=currentLandlord();const bs=db.bills,overdue=bs.filter(b=>billBalance(b)>0&&daysLate(b.dueDate)>0),unpaid=bs.filter(b=>billBalance(b)>0);$("#app").innerHTML=nav()+`<main><div class="row"><div><div class="title">${esc(db.settings.name)}</div><div class="muted">Admin panel · Welcome, ${esc(u.name)}</div></div><button class="primary" id="addBill">＋ Add bill</button></div><div class="tabs"><button class="${page==="dashboard"?"active":""}" data-page="dashboard">Dashboard</button><button class="${page==="tenants"?"active":""}" data-page="tenants">Rental Pages</button><button class="${page==="bills"?"active":""}" data-page="bills">Bills</button><button class="${page==="payments"?"active":""}" data-page="payments">Payments</button><button class="${page==="settings"?"active":""}" data-page="settings">Settings</button></div>${page==="dashboard"?dashboard():page==="tenants"?tenantsPage():page==="bills"?billsPage():page==="payments"?paymentsPage():settingsPage()}</main>`;wireAdmin()}
function wireAdmin(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$("#logout").onclick=signout;$("#theme").onclick=()=>{db.settings.theme=db.settings.theme==="dark"?"light":db.settings.theme==="light"?"system":"dark";save();render()};$("#export").onclick=backup;$("#addBill").onclick=()=>billDialog()}
function billPaidAmount(b){return Math.min(Number(b.total||0),db.payments.filter(p=>p.billId===b.id).reduce((s,p)=>s+Number(p.amount||0),0))}
function billBalance(b){return Math.max(0,Number(b.total||0)-billPaidAmount(b))}
function isPaid(b){return billBalance(b)<=0 && Number(b.total||0)>0}
function isPartial(b){const p=billPaidAmount(b);return p>0 && p<Number(b.total||0)}
function tenantName(id){return db.tenants.find(t=>t.id===id)?.name||db.deletedTenants.find(t=>t.id===id)?.name||"Deleted tenant"}
function dashboard(){const due=db.bills.filter(b=>!isPaid(b)),overdue=due.filter(b=>daysLate(b.dueDate)>0),income=db.payments.reduce((s,p)=>s+Number(p.amount||0),0);return `<div class="grid"><div class="card stat"><span class="muted">Rental pages</span><b>${db.tenants.length}</b></div><div class="card stat"><span class="muted">Unpaid</span><b>${money(due.reduce((s,b)=>s+b.total,0))}</b></div><div class="card stat"><span class="muted">Overdue</span><b>${overdue.length}</b></div><div class="card stat"><span class="muted">Collected</span><b>${money(income)}</b></div></div>${overdue.length?`<div class="alert">⚠️ ${overdue.length} overdue bill(s). These renters should be notified.</div>`:`<div class="card">✅ No overdue bills.</div>`}<div class="card"><div class="row"><b>Rental pages</b><button class="small" onclick="page='tenants';render()">Manage all</button></div>${db.tenants.slice(0,8).map(t=>rentalStatusRow(t)).join("")||`<div class="empty">No rental pages yet.</div>`}</div>`}
function rentalStatusRow(t){const b=db.bills.find(x=>x.tenantId===t.id&&x.month===monthNow());const late=b&&billBalance(b)>0&&daysLate(b.dueDate)>0;return `<div class="row" style="padding:11px 0;border-bottom:1px solid var(--border)"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.room||"")} · ${esc(t.renterEmail||"No renter login")}</div></div><span class="badge ${!b?"warn":isPaid(b)?"paid":late?"due":"warn"}">${!b?"No bill":isPaid(b)?"Paid":isPartial(b)?(late?"Partial · Overdue":"Partial · Due"):late?"Overdue":"Due"}</span></div>`}
function tenantsPage(){return `<div class="card"><div class="row"><div><b>Rental Pages</b><div class="muted">Create a separate login/page for every renter. All are controlled here.</div></div><button class="primary" onclick="tenantDialog()">＋ Add rental page</button></div></div>${db.tenants.map(t=>{const b=db.bills.find(x=>x.tenantId===t.id&&x.month===monthNow());const bal=b?billBalance(b):0;return `<div class="card"><div class="row"><div class="detail-hero"><div>${t.photo?`<img class="renter-photo" src="${esc(t.photo)}" alt="Renter">`:`<div class="photo-placeholder">👤</div>`}</div><div><b>${esc(t.name)}</b><div class="muted">Room: ${esc(t.room||"-")} · Rent: ${money(t.rent)}</div><div class="muted">Electricity: ${esc(t.unitRate||0)} / unit · Login: ${esc(t.renterEmail||"Not configured")}</div></div></div><div class="actions"><button class="small" onclick="tenantDetails('${t.id}')">Details</button><button class="small" onclick="tenantDialog('${t.id}')">Edit</button><button class="small" onclick="billDialogForTenant('${t.id}')">This month bill</button><button class="small danger" onclick="deleteTenant('${t.id}')">Delete</button></div></div><div class="status-line">${b?`<span>Rent: <b>${isPaid(b)?"Paid":isPartial(b)?"Partial":"Not paid"}</b></span><span>Electricity: <b>${Number(b.electricity||0)>0?"Added":"Not added"}</b></span><span>Units: <b>${esc(b.units||0)}</b></span><span>₹/unit: <b>${money(b.unitRate||t.unitRate||0)}</b></span><span>Total: <b>${money(b.total)}</b></span><span>Paid: <b>${money(billPaidAmount(b))}</b></span><span>Balance: <b class="${bal>0?"danger-text":""}">${money(bal)}</b></span>`:`<span>No bill generated for ${monthNow()}</span>`}</div></div>`}).join("")||`<div class="empty">No rental pages. Add your first renter.</div>`}`}
function tenantDetails(id){const t=db.tenants.find(x=>x.id===id);if(!t)return;const mask=v=>{v=String(v||"");return v?"•••• "+v.slice(-4):"Not added"};const photo=t.photo?`<img class="renter-photo" src="${esc(t.photo)}" alt="Renter photo">`:`<div class="photo-placeholder">👤</div>`;const body=`<div class="detail-hero"><div>${photo}</div><div><h3 style="margin:0">Renter Details</h3><div class="muted">Rental profile and move-in information</div></div></div><div class="details-grid"><div><span class="muted">Name</span><b>${esc(t.name||"—")}</b></div><div><span class="muted">Father name</span><b>${esc(t.fatherName||"—")}</b></div><div><span class="muted">Aadhaar</span><b>${esc(mask(t.aadhaar))}</b></div><div><span class="muted">Phone</span><b>${esc(t.phone||"—")}</b></div><div><span class="muted">Registration no.</span><b>${esc(t.registrationNo||"—")}</b></div><div><span class="muted">Age</span><b>${esc(t.age||"—")}</b></div><div><span class="muted">House entry / move-in date</span><b>${esc(t.moveInDate||"—")}</b></div><div><span class="muted">Rent</span><b>${money(t.rent)}</b></div><div><span class="muted">Electricity cost / unit</span><b>${money(t.unitRate||0)}</b></div><div><span class="muted">Room / flat</span><b>${esc(t.room||"—")}</b></div><div class="full"><span class="muted">Original address</span><b>${esc(t.originalAddress||"—")}</b></div><div class="full"><span class="muted">Old address</span><b>${esc(t.oldAddress||"—")}</b></div></div><p class="muted">Aadhaar is masked in this local version for privacy.</p><div class="actions"><button class="primary" onclick="tenantDialog('${t.id}')">Edit details</button><button onclick="billDialogClose()">Close</button></div>`;$("#billDialog").innerHTML=body;$("#billDialog").showModal()}
function billsPage(){const list=db.bills.slice().sort((a,b)=>b.dueDate.localeCompare(a.dueDate));return `<div class="card"><div class="row"><b>Bills</b><div class="actions"><select id="monthFilter"><option value="all">All months</option>${[...new Set(db.bills.map(b=>b.month))].sort().reverse().map(m=>`<option value="${m}" ${m===filterMonth?"selected":""}>${m}</option>`).join("")}</select><button class="small" onclick="generateBills()">Generate this month</button></div></div></div>${list.filter(b=>filterMonth==="all"||b.month===filterMonth).map(b=>`<div class="card">${billRow(b)}<div class="actions" style="margin-top:10px"><button class="small" onclick="billDialog('${b.id}')">Edit</button>${isPaid(b)?`<button class="small" onclick="receipt('${b.id}')">Receipt</button>`:`<button class="small primary" onclick="payBill('${b.id}')">Record payment</button>`}<button class="small" onclick="printBill('${b.id}')">Print / PDF</button><button class="small danger" onclick="deleteBill('${b.id}')">Delete</button></div></div>`).join("")||`<div class="empty">No bills found.</div>`}`}
function billRow(b){const bal=billBalance(b),late=bal>0&&daysLate(b.dueDate)>0;return `<div class="row" style="padding:11px 0"><div><b>${esc(tenantName(b.tenantId))}</b><div class="muted">${esc(b.month)} · Due ${esc(b.dueDate)}</div></div><div style="text-align:right"><b>${money(b.total)}</b><br><span class="badge ${isPaid(b)?"paid":isPartial(b)?"warn":late?"due":"warn"}">${isPaid(b)?"Paid":isPartial(b)?"Partial · "+money(bal)+" left":late?daysLate(b.dueDate)+" days late":"Due"}</span></div></div>`}
function paymentsPage(){const active=db.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)),deleted=db.deletedTenants||[];return `<div class="card"><div class="row"><div><b>Payment history</b><div class="muted">Record, review, or remove individual payment records.</div></div><button class="primary" onclick="recordPaymentPicker()">＋ Record payment</button></div></div>${active.map(p=>`<div class="card row"><div><b>${esc(tenantName(p.tenantId))}</b><div class="muted">${esc(p.date)} · ${esc(p.paidAt?new Date(p.paidAt).toLocaleString("en-IN"):p.date)} · ${esc(p.method||"Cash")} · ${p.billId?"Bill linked":"Manual payment"}</div></div><div class="actions"><b>${money(p.amount)}</b><button class="small danger" onclick="deletePayment('${p.id}')">Delete</button></div></div>`).join("")||`<div class="empty">No payments recorded.</div>`}<div class="card" style="margin-top:18px"><b>Deleted tenant history</b><div class="muted">Deleted rental pages stay here until permanently removed.</div></div>${deleted.map(t=>`<div class="card row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.room||"")} · Deleted ${esc(t.deletedAt||"")}</div></div><button class="small danger" onclick="deleteTenantHistory('${t.id}')">Remove history</button></div>`).join("")||`<div class="empty">No deleted tenant history.</div>`}`}
function recordPaymentPicker(){if(!db.tenants.length)return toast("Add a renter first.");const opts=db.tenants.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");$("#billDialog").innerHTML=`<h3>Record payment</h3><div class="form"><div class="full"><label>Renter</label><select id="pt">${opts}</select></div><div><label>Amount</label><input id="pa" type="number" min="0.01" step="0.01"></div><div><label>Date & time received</label><input id="pd" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></div><div class="full"><label>Payment method</label><select id="pm"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="saveP">Save payment</button><button onclick="billDialogClose()">Cancel</button></div>`;$("#billDialog").showModal();$("#saveP").onclick=()=>{const amount=Number($("#pa").value);if(!amount||amount<0)return toast("Enter a valid amount.");db.payments.push({id:uid(),tenantId:$("#pt").value,amount,date:$("#pd").value?.slice(0,10)||today(),paidAt:$("#pd").value||new Date().toISOString().slice(0,16),method:$("#pm").value});save();billDialogClose();toast("Payment recorded.");render()}}
function deletePayment(id){if(!confirm("Delete this payment record? This cannot be undone."))return;db.payments=db.payments.filter(p=>p.id!==id);save();toast("Payment deleted.");render()}
function deleteTenantHistory(id){if(!confirm("Permanently remove this deleted tenant's history? Bills and payments remain."))return;db.deletedTenants=(db.deletedTenants||[]).filter(t=>t.id!==id);save();toast("Deleted tenant history removed.");render()}
function settingsPage(){return `<div class="card"><b>Property settings</b><div class="form" style="margin-top:12px"><div class="full"><label>Property / enterprise name</label><input id="propertyName" value="${esc(db.settings.name)}"></div><button class="primary" onclick="saveSettings()">Save</button></div></div><div class="card"><b>Backup & restore</b><p class="muted">Export a JSON backup regularly. Restore replaces the current local data.</p><div class="actions"><button onclick="backup()">Export backup</button><button onclick="restoreInput.click()">Import backup</button><input id="restoreInput" type="file" accept=".json,application/json" hidden></div></div><div class="card"><b>Security</b><p class="muted">Landlord and renter passwords are salted and hashed with PBKDF2-SHA-256. This build stores data locally in this browser. For real cross-device multi-user access, a secure server database is required.</p></div>`}
function wirePage(){const m=$("#monthFilter");if(m)m.onchange=()=>{filterMonth=m.value;render()};const ri=$("#restoreInput");if(ri)ri.onchange=e=>restore(e.target.files[0])}
function tenantDialog(id){const t=db.tenants.find(x=>x.id===id)||{name:"",fatherName:"",aadhaar:"",room:"",phone:"",registrationNo:"",originalAddress:"",oldAddress:"",age:"",moveInDate:"",photo:"",unitRate:0,rent:0,dueDay:5,renterEmail:"",renterPasswordHash:"",renterSalt:""};$("#billDialog").innerHTML=`<h3>${id?"Edit":"Add"} rental page</h3><div class="form"><div class="full"><label>Renter name</label><input id="tn" value="${esc(t.name)}"></div><div><label>Father name</label><input id="tf" value="${esc(t.fatherName||"")}"></div><div><label>Age</label><input id="ta" type="number" min="1" max="120" value="${esc(t.age||"")}"></div><div><label>Aadhaar card number</label><input id="tad" inputmode="numeric" maxlength="12" value="${esc(t.aadhaar||"")}" placeholder="12-digit Aadhaar"></div><div><label>Phone no.</label><input id="tp" inputmode="tel" value="${esc(t.phone||"")}"></div><div><label>Registration no.</label><input id="treg" value="${esc(t.registrationNo||"")}"></div><div><label>Room / flat</label><input id="tr" value="${esc(t.room||"")}"></div><div><label>Monthly rent</label><input id="te" type="number" min="0" value="${t.rent||0}"></div><div><label>Electricity cost per unit (₹)</label><input id="tur" type="number" min="0" step="0.01" value="${t.unitRate||0}"></div><div><label>Due day (1–28)</label><input id="td" type="number" min="1" max="28" value="${t.dueDay||5}"></div><div><label>When renter came / move-in date</label><input id="tmi" type="date" value="${esc(t.moveInDate||"")}"></div><div><label>Renter photo</label><input id="tphoto" type="file" accept="image/*"></div><div class="full">${t.photo?`<img class="renter-photo" src="${esc(t.photo)}" alt="Current renter photo">`:``}<div class="muted">Photo is stored in this browser. Use a small image for best performance.</div></div><div class="full"><label>Original address</label><textarea id="toa" rows="2">${esc(t.originalAddress||"")}</textarea></div><div class="full"><label>Old address</label><textarea id="told" rows="2">${esc(t.oldAddress||"")}</textarea></div><div class="full"><label>Renter login email</label><input id="re" type="email" value="${esc(t.renterEmail||"")}" placeholder="renter@example.com"></div><div class="full"><label>${id?"New renter password (leave blank to keep current)":"Renter password"}</label><input id="rp" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div></div><p class="muted">Aadhaar is stored only in this browser and masked in the details view.</p><div class="actions" style="margin-top:14px"><button class="primary" id="saveT">Save rental page</button><button onclick="billDialogClose()">Cancel</button></div>`;$("#billDialog").showModal();$("#saveT").onclick=async()=>{try{const v=id=>document.getElementById(id).value.trim();if(!v("tn"))throw Error("Enter a renter name.");const email=v("re");if(!email)throw Error("Enter renter login email.");const pass=v("rp");const aad=v("tad");if(aad&&(!/^\d{12}$/.test(aad)))throw Error("Aadhaar must contain 12 digits.");if(!id&&!pass)throw Error("Enter a renter password.");if(pass&&pass.length<8)throw Error("Renter password must be at least 8 characters.");if(db.tenants.some(x=>x.id!==t.id&&x.renterEmail&&x.renterEmail.toLowerCase()===email.toLowerCase()))throw Error("That renter email is already used.");let photo=t.photo||"";const file=$("#tphoto").files[0];if(file){if(file.size>1500000)throw Error("Please choose a photo smaller than 1.5 MB.");photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}const obj={id:t.id||uid(),name:v("tn"),fatherName:v("tf"),aadhaar:aad,room:v("tr"),phone:v("tp"),registrationNo:v("treg"),originalAddress:v("toa"),oldAddress:v("told"),age:v("ta"),moveInDate:v("tmi"),photo,unitRate:+v("tur")||0,rent:+v("te")||0,dueDay:Math.min(28,Math.max(1,+v("td")||5)),renterEmail:email,renterPasswordHash:t.renterPasswordHash||"",renterSalt:t.renterSalt||""};if(pass){obj.renterSalt=randSalt();obj.renterPasswordHash=await hashPassword(pass,obj.renterSalt)}if(t.id)Object.assign(t,obj);else db.tenants.push(obj);save();billDialogClose();toast("Rental page saved.");render()}catch(e){toast(e.message)}}}
function deleteTenant(id){const t=db.tenants.find(x=>x.id===id);if(!t)return;if(confirm("Delete this rental page? Its bills and payment history will be kept in Deleted Tenant History.")){db.deletedTenants ||= [];db.deletedTenants.push({...t,deletedAt:today()});db.tenants=db.tenants.filter(x=>x.id!==id);save();render();toast("Rental page moved to Deleted Tenant History.")}}
function billDialogForTenant(tenantId){const existing=db.bills.find(b=>b.tenantId===tenantId&&b.month===monthNow());billDialog(existing?.id,tenantId)}
function billDialog(id,forcedTenantId){const b=db.bills.find(x=>x.id===id)||{tenantId:forcedTenantId||db.tenants[0]?.id||"",month:monthNow(),dueDate:today(),rent:0,electricity:0,units:"",unitRate:0,notes:""};const tenant=db.tenants.find(t=>t.id===b.tenantId);const rentDefault=b.rent||tenant?.rent||0;const rateDefault=b.unitRate??tenant?.unitRate??0;$("#billDialog").innerHTML=`<h3>${id?"Edit":"Add"} bill</h3><div class="form"><div class="full"><label>Renter</label><select id="bt">${db.tenants.map(t=>`<option value="${t.id}" ${t.id===b.tenantId?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div><div><label>Month</label><input id="bm" type="month" value="${b.month}"></div><div><label>Due date</label><input id="bd" type="date" value="${b.dueDate}"></div><div><label>Rent</label><input id="br" type="number" value="${rentDefault}"></div><div><label>Electricity units</label><input id="bu" type="number" min="0" step="0.01" value="${esc(b.units||"")}"></div><div><label>Cost per unit (₹)</label><input id="bur" type="number" min="0" step="0.01" value="${rateDefault}"></div><div><label>Electricity amount (₹)</label><input id="be" type="number" min="0" step="0.01" value="${b.electricity||0}"></div><div class="full unit-box"><b>Electricity calculation</b><div class="muted"><span id="unitPreview">${esc(b.units||0)} units × ${money(rateDefault)} = ${money(b.electricity||0)}</span></div></div><div class="full"><label>Notes</label><input id="bn" value="${esc(b.notes||"")}"></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="saveB">Save</button><button onclick="billDialogClose()">Cancel</button></div>`;$("#billDialog").showModal();const calc=()=>{const u=Number($("#bu").value)||0,r=Number($("#bur").value)||0;$("#be").value=(u*r).toFixed(2);$("#unitPreview").textContent=`${u} units × ${money(r)} = ${money(u*r)}`};$("#bu").oninput=calc;$("#bur").oninput=calc;$("#saveB").onclick=()=>{const v=id=>document.getElementById(id).value;const obj={id:b.id||uid(),tenantId:v("bt"),month:v("bm"),dueDate:v("bd"),rent:+v("br")||0,electricity:+v("be")||0,units:v("bu"),unitRate:+v("bur")||0,notes:v("bn"),total:(+v("br")||0)+(+v("be")||0),paidAt:b.paidAt||null,paidAmount:b.paidAmount||null,paymentMethod:b.paymentMethod||""};if(!obj.tenantId)return toast("Add a renter first.");if(b.id)Object.assign(b,obj);else db.bills.push(obj);save();billDialogClose();render()}}
function billDialogClose(){$("#billDialog").close()}
function generateBills(){const m=monthNow();let made=0;db.tenants.forEach(t=>{if(db.bills.some(b=>b.tenantId===t.id&&b.month===m))return;const day=String(t.dueDay||5).padStart(2,"0");db.bills.push({id:uid(),tenantId:t.id,month:m,dueDate:m+"-"+day,rent:+t.rent||0,electricity:0,units:"",unitRate:+t.unitRate||0,notes:"",total:+t.rent||0,paidAt:null});made++});save();toast(made+" bill(s) generated.");render()}
function payBill(id){const b=db.bills.find(x=>x.id===id);if(!b)return;const remaining=billBalance(b);if(remaining<=0)return toast("This bill is already fully paid.");const amount=prompt("Payment amount (remaining: "+remaining+")",String(remaining));if(amount===null)return;const n=Number(amount);if(!Number.isFinite(n)||n<=0)return toast("Invalid amount.");if(n>remaining)return toast("Payment cannot be greater than the remaining balance.");const method=prompt("Payment method","Cash")||"Cash";db.payments.push({id:uid(),billId:b.id,tenantId:b.tenantId,amount:n,date:today(),paidAt:new Date().toISOString(),method});const newPaid=billPaidAmount(b)+n;b.paidAmount=newPaid;b.paidAt=newPaid>=Number(b.total||0)?today():null;b.paymentMethod=method;save();toast(n>=remaining?"Bill fully paid.":"Partial payment recorded. Remaining: "+money(remaining-n));render()}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rent-manager-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href)}
async function restore(file){if(!file)return;try{const x=JSON.parse(await file.text());if(!x.users||!x.tenants||!x.bills)throw Error();x.deletedTenants ||= [];x.payments ||= [];x.settings ||= {theme:"system",name:"My Property"};x.tenants.forEach(t=>{t.renterEmail??="";t.renterPasswordHash??="";t.renterSalt??="";t.fatherName??="";t.aadhaar??="";t.registrationNo??="";t.originalAddress??="";t.oldAddress??="";t.age??="";t.moveInDate??="";t.photo??="";t.unitRate??=0});x.users.forEach(u=>u.role??="landlord");if(!confirm("Replace all current local data with this backup?"))return;db=x;save();session=null;clearSession();renderLoginHome();toast("Backup restored.")}catch{toast("Invalid backup file.")}}
function saveSettings(){db.settings.name=$("#propertyName").value.trim()||"My Property";save();toast("Settings saved.");render()}
function deleteBill(id){if(confirm("Delete this bill? Payment history remains.")){db.bills=db.bills.filter(b=>b.id!==id);save();render()}}

function renterRentHistory(t){const bills=db.bills.filter(b=>b.tenantId===t.id).sort((a,b)=>String(b.month).localeCompare(String(a.month)));if(!bills.length)return `<div class="card"><div class="row"><div><b>Rent payment history</b><div class="muted">Month-by-month status</div></div></div><div class="empty">No monthly rent bills are available yet.</div></div>`;return `<div class="card"><div class="row"><div><b>Rent payment history</b><div class="muted">See whether your rent was paid for each month.</div></div><span class="badge paid">${bills.filter(isPaid).length} paid</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Month</th><th>Rent</th><th>Paid</th><th>Balance</th><th>Payment time</th><th>Status</th></tr></thead><tbody>${bills.map(b=>{const paid=billPaidAmount(b),bal=billBalance(b),partial=isPartial(b),late=bal>0&&daysLate(b.dueDate)>0;return `<tr><td><b>${esc(b.month)}</b></td><td>${money(b.rent)}</td><td>${money(paid)}</td><td>${money(bal)}</td><td>${esc((db.payments.filter(p=>p.billId===b.id).sort((x,y)=>String(y.paidAt||y.date).localeCompare(String(x.paidAt||x.date)))[0]?.paidAt?new Date(db.payments.filter(p=>p.billId===b.id).sort((x,y)=>String(y.paidAt||y.date).localeCompare(String(x.paidAt||x.date)))[0].paidAt).toLocaleString("en-IN"):"—"))}</td><td><span class="badge ${isPaid(b)?"paid":partial?"warn":"due"}">${isPaid(b)?"Paid":partial?(late?"Partial · Overdue":"Partial"):(late?"Not paid · Overdue":"Not paid")}</span></td></tr>`}).join("")}</tbody></table></div></div>`}

function renderRenter(){const t=currentRenter();const b=db.bills.find(x=>x.tenantId===t.id&&x.month===monthNow());const balance=b?billBalance(b):0;const overdue=b&&balance>0&&daysLate(b.dueDate)>0;const rentPaid=!!(b&&isPaid(b));const partial=b&&isPartial(b);const electricityAdded=!!(b&&Number(b.electricity||0)>0);const electricityPaid=!!(b&&isPaid(b));$("#app").innerHTML=renterNav()+`<main><div class="card renter-welcome"><div><div class="title">Welcome, ${esc(t.name)}</div><div class="muted">Your rental page · ${monthNow()}</div></div></div>${overdue?`<div class="alert renter-alert">🔔 ${partial?"Your rent has been partly paid. "+money(balance)+" is still overdue.":"Your rent payment is overdue. Please contact your landlord or make the payment."}</div>`:b&&!rentPaid?`<div class="alert renter-alert">🔔 ${partial?"Partial payment received. "+money(balance)+" is still left.":"Your rent for this month is not paid yet."}</div>`:`<div class="card">${b?"✅ Your rent is fully paid for this month.":"No bill has been generated for this month yet."}</div>`}<div class="grid2"><div class="card status-card"><span class="status-icon">🏠</span><h3>Rent</h3><b class="big">${b?money(b.rent):"—"}</b><span class="badge ${rentPaid?"paid":partial?"warn":"due"}">${b?(rentPaid?"Paid":partial?"Partial":"Not paid"):"No bill"}</span></div><div class="card status-card"><span class="status-icon">⚡</span><h3>Electricity</h3><b class="big">${b?money(b.electricity):"—"}</b><span class="badge ${!b||!electricityAdded?"warn":electricityPaid?"paid":"due"}">${!b?"No bill":!electricityAdded?"Not added":electricityPaid?"Paid":"Not paid"}</span></div></div>${b?`<div class="card"><div class="row"><div><b>This month's bill</b><div class="muted">Due ${esc(b.dueDate)}</div></div><b>${money(b.total)}</b></div><div class="status-list"><div><span>Electricity units</span><b>${esc(b.units||0)} unit(s) × ${money(b.unitRate||t.unitRate||0)}</b></div><div><span>Paid so far</span><b>${money(billPaidAmount(b))}</b></div><div><span>Balance left</span><b>${money(balance)}</b></div><div><span>Rent payment</span><b>${rentPaid?"Paid":partial?"Partial":"Not paid"}</b></div><div><span>Electricity payment</span><b>${electricityAdded?(electricityPaid?"Paid":"Not paid"):"Not added"}</b></div><div><span>Total</span><b>${money(b.total)}</b></div></div></div>`:""}${renterRentHistory(t)}<p class="muted center">Your renter account can only view this rental page. Payment recording and other rental pages are controlled by the landlord.</p></main>`;$("#logout").onclick=signout;$("#theme").onclick=()=>{db.settings.theme=db.settings.theme==="dark"?"light":db.settings.theme==="light"?"system":"dark";save();render()}}

function receipt(id){const b=db.bills.find(x=>x.id===id);if(!b)return;const p=db.payments.find(x=>x.billId===id);printHtml("Payment Receipt",receiptHtml(b,p))}
function receiptHtml(b,p){const paid=p?.amount||b.paidAmount||b.total;return `<div class="head"><div><h1>Payment Receipt</h1><div class="muted">${esc(db.settings.name)}</div></div><div class="meta"><b>Receipt</b><br>${esc(p?.paidAt?(new Date(p.paidAt).toLocaleString("en-IN")):p?.date||b.paidAt||today())}</div></div><p><b>Tenant:</b> ${esc(tenantName(b.tenantId))}</p><p><b>Bill month:</b> ${esc(b.month)} &nbsp; <b>Payment method:</b> ${esc(p?.method||b.paymentMethod||"")}</p><table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td>Rent</td><td>${money(b.rent)}</td></tr><tr><td>Electricity${b.units?` (${esc(b.units)} units × ${money(b.unitRate||0)}/unit)`:""}</td><td>${money(b.electricity)}</td></tr></tbody></table><div class="total">Amount paid: ${money(paid)}</div><div class="footer">Generated by Rent Manager · Keep this receipt for your records.</div>`}
function printBill(id){const b=db.bills.find(x=>x.id===id);if(!b)return;const body=`<div class="head"><div><h1>Rent Bill</h1><div class="muted">${esc(db.settings.name)}</div></div><div class="meta"><b>Bill month</b><br>${esc(b.month)}<br><b>Due</b><br>${esc(b.dueDate)}</div></div><p><b>Tenant:</b> ${esc(tenantName(b.tenantId))}</p><table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td>Monthly rent</td><td>${money(b.rent)}</td></tr><tr><td>Electricity${b.units?` (${esc(b.units)} units × ${money(b.unitRate||0)}/unit)`:""}</td><td>${money(b.electricity)}</td></tr></tbody></table><div class="total">Total: ${money(b.total)}</div>${b.notes?`<p><b>Notes:</b> ${esc(b.notes)}</p>`:""}<div class="total">Paid: ${money(billPaidAmount(b))} · Balance: ${money(billBalance(b))}</div><div class="footer">Generated by Rent Manager · ${isPaid(b)?"Status: Paid":isPartial(b)?"Status: Partial payment":"Status: Due"}</div>`;printHtml("Rent Bill",body)}
function printHtml(title,body){const w=window.open("","_blank","noopener,noreferrer");if(!w)return toast("Allow pop-ups for the PDF preview.");const css=`<style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{margin:0;background:#fff;color:#172033;font:14px/1.5 Arial,sans-serif}.sheet{max-width:180mm;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #2563eb;padding-bottom:16px;margin-bottom:22px}h1{font-size:28px;margin:0 0 4px}.muted{color:#64748b}.meta{background:#f1f5f9;border-radius:10px;padding:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px 7px;border-bottom:1px solid #dbe2ea;text-align:left}th:last-child,td:last-child{text-align:right}.total{font-size:20px;font-weight:800;text-align:right;padding-top:18px}.footer{margin-top:55px;border-top:1px solid #dbe2ea;padding-top:12px;color:#64748b;font-size:12px}.toolbar{position:sticky;top:0;background:#172033;color:#fff;padding:10px;text-align:center;z-index:5}.toolbar button{padding:9px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700}@media print{.toolbar{display:none!important}}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.role-card{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:18px;border:1px solid var(--border);background:var(--card);border-radius:16px}.role-card span{font-size:34px}.role-card b{font-size:16px}.role-card small{color:var(--muted);line-height:1.35}.role-chip{font-size:11px;border:1px solid var(--border);padding:2px 7px;border-radius:99px;color:var(--muted);vertical-align:middle}.status-line,.status-list{display:flex;gap:12px;flex-wrap:wrap;padding-top:10px;color:var(--muted);font-size:13px}.status-list{display:block}.status-list>div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}.status-list>div:last-child{border-bottom:0}.status-card{text-align:center}.status-icon{font-size:30px}.big{display:block;font-size:25px;margin:5px 0 10px}.renter-welcome{display:flex;align-items:center}.renter-alert{font-weight:700}@media(max-width:600px){.role-grid{grid-template-columns:1fr}.role-card{min-height:125px}}

</style>`;const doc=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>${css}</head><body><div class="toolbar"><button onclick="window.print()">Download / Save as PDF</button></div><div class="sheet">${body}</div><script>window.addEventListener("load",()=>setTimeout(()=>window.print(),400));<\/script></body></html>`;w.document.open();w.document.write(doc);w.document.close()}
